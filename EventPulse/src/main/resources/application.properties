spring.application.name=EventPulse

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Signing key for Remember-Me cookies. Set EVENTPULSE_REMEMBER_ME_KEY in every environment.
# Local example: export EVENTPULSE_REMEMBER_ME_KEY=local-dev-only-change-me
eventpulse.security.remember-me-key=${EVENTPULSE_REMEMBER_ME_KEY}
