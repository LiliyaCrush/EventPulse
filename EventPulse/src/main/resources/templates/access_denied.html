<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventPulse · Access Denied</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/css/favicon.svg}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body ep-denied-body">

<main class="ep-denied">
    <div class="ep-denied-card">
        <a class="ep-denied-brand" th:href="@{/}">
            <span class="ep-brand-mark" aria-hidden="true">EP</span>
            <span>EventPulse</span>
        </a>

        <div class="ep-denied-icon" aria-hidden="true">
            <i class="bi bi-shield-lock"></i>
        </div>

        <p class="ep-denied-code">403</p>
        <h1>Access Denied</h1>
        <p class="ep-denied-copy">
            You don’t have permission to perform this action.
            Your account can view events and reports, but only administrators
            can create, edit, or delete records.
        </p>

        <div class="ep-denied-actions">
            <a class="btn ep-btn-primary" th:href="@{/}">
                <i class="bi bi-house-door" aria-hidden="true"></i>
                Return to Dashboard
            </a>
        </div>

        <p class="ep-denied-meta" sec:authorize="isAuthenticated()">
            Signed in as
            <strong sec:authentication="name">user</strong>
            <span sec:authorize="hasRole('ADMIN')">· Administrator</span>
            <span sec:authorize="hasRole('VIEWER')">· Viewer</span>
        </p>
    </div>
</main>

</body>
</html>
