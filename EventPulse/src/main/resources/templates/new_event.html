<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventPulse · Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="app-body">

<nav class="navbar navbar-expand-lg ep-navbar">
    <div class="container">
        <a class="navbar-brand ep-brand" th:href="@{/}">
            <span class="ep-brand-mark" aria-hidden="true">EP</span>EventPulse
        </a>
        <button class="navbar-toggler ep-nav-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#epMainNav" aria-controls="epMainNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="epMainNav">
            <ul class="navbar-nav ep-nav-links me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/reports/attendance}">Reports</a>
                </li>
            </ul>
            <div class="d-flex flex-wrap align-items-center gap-2 ep-nav-actions">
                <a class="btn btn-sm ep-nav-cta" th:href="@{/showNewEventForm}">Add New Event</a>
                <form th:action="@{/logout}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="container ep-page ep-form-page">
    <div class="ep-form-shell">
        <header class="ep-form-page-header">
            <h1 th:text="${event.id != null} ? 'Edit Event' : 'Add Event'">Add Event</h1>
            <p th:text="${event.id != null} ? 'Update an existing network event record.' : 'Create and manage network event records.'">
                Create and manage network event records.
            </p>
        </header>

        <div class="ep-panel ep-form-card">
            <form th:action="@{/saveEvent}" th:object="${event}" method="post" class="ep-event-form">
                <input type="hidden" th:field="*{id}" />

                <section class="ep-form-section">
                    <h2 class="ep-form-section-title">Event Information</h2>
                    <div class="ep-form-field">
                        <label for="title" class="form-label">Event Title <span class="ep-required" aria-hidden="true">*</span></label>
                        <input type="text" class="form-control ep-form-control" id="title" th:field="*{title}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                    <div class="ep-form-field">
                        <label for="eventDate" class="form-label">Event Date</label>
                        <input type="date" class="form-control ep-form-control" id="eventDate" th:field="*{eventDate}">
                    </div>
                </section>

                <section class="ep-form-section">
                    <h2 class="ep-form-section-title">Event Metrics</h2>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="ep-form-field mb-0">
                                <label for="attendance" class="form-label">Attendance</label>
                                <input type="number" min="0" class="form-control ep-form-control" id="attendance" th:field="*{attendance}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{attendance}"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="ep-form-field mb-0">
                                <label for="wifiEstimate" class="form-label">Wi-Fi Estimate</label>
                                <input type="number" min="0" class="form-control ep-form-control" id="wifiEstimate" th:field="*{wifiEstimate}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{wifiEstimate}"></div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="ep-form-field mb-0">
                                <label for="networkUsage" class="form-label">Network Usage</label>
                                <input type="number" min="0" step="0.01" class="form-control ep-form-control" id="networkUsage" th:field="*{networkUsage}" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:errors="*{networkUsage}"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="ep-form-section">
                    <h2 class="ep-form-section-title">Additional Notes</h2>
                    <div class="ep-form-field mb-0">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control ep-form-control ep-form-notes" id="notes" rows="6" th:field="*{notes}"></textarea>
                    </div>
                </section>

                <div class="ep-form-actions">
                    <button type="submit" class="btn ep-btn-primary">Save Event</button>
                    <a class="btn btn-outline-secondary ep-btn-clear" th:href="@{/}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer class="ep-footer text-center">
    <small><strong>EventPulse</strong> · Network event operations</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
