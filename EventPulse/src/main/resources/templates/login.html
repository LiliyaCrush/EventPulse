<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EventPulse · Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="ep-login">

<div class="ep-login-shell">
    <div class="ep-login-panel">
        <header class="ep-login-brand">
            <div class="ep-login-logo" aria-hidden="true">
                <span class="ep-brand-mark">EP</span>
            </div>
            <h1 class="ep-login-product">EventPulse</h1>
            <p class="ep-login-subtitle">Secure access to network event operations.</p>
        </header>

        <div class="card ep-login-card border-0">
            <div class="card-body">
                <div class="ep-login-card-heading">
                    <h2>Welcome back</h2>
                    <p>Sign in to continue to your workspace.</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger ep-login-alert" role="alert">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-success ep-login-alert" role="alert">
                    You have been logged out successfully.
                </div>

                <form th:action="@{/login}" method="post" class="ep-login-form">
                    <div class="ep-login-field">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" required autofocus autocomplete="username" placeholder="Enter your username">
                    </div>
                    <div class="ep-login-field">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg ep-login-submit w-100">Sign In</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
